# service.yaml
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: default
spec:
  type: NodePort

  selector:
    app: qbittorrent

  ports:
    - name: webui
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

    - name: torrent-tcp
      protocol: TCP
      port: 6881
      targetPort: 6881
      nodePort: 30681

    - name: torrent-udp
      protocol: UDP
      port: 6881
      targetPort: 6881
      nodePort: 30681